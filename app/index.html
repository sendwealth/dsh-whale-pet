<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
  <title>鲸鱼娘桌宠</title>
  <link rel="stylesheet" href="pet.css">
</head>
<body>
  <div class="pet" id="pet" role="button" aria-label="Whale pet">
    <div class="bubble" id="bubble" hidden>
      <div class="bubble-text" id="bubble-text"></div>
      <div class="dots" id="dots" hidden><span></span><span></span><span></span></div>
    </div>
    <div class="chat-input" id="chat-input" hidden>
      <input id="chat-text" type="text" maxlength="500"
        placeholder="和她说点什么… / Say something…" autocomplete="off">
      <button id="chat-send" title="发送 / Send">➤</button>
    </div>
    <div class="figure" id="figure">
      <img id="pet-img" src="whale-girl-small.png" alt="" draggable="false">
      <svg class="sparkle s1" viewBox="0 0 24 24"><path d="M12 3 L12 21 M3 12 L21 12" stroke="#ffd76e" stroke-width="3" stroke-linecap="round"/></svg>
      <svg class="sparkle s2" viewBox="0 0 24 24"><path d="M12 3 L12 21 M3 12 L21 12" stroke="#9ec3ff" stroke-width="3" stroke-linecap="round"/></svg>
    </div>
  </div>
  <script src="pet-states.js"></script>
  <script src="sensors.js"></script>
  <script src="pet.js"></script>
</body>
</html>
